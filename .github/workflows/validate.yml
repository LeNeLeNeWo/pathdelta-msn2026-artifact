name: validate-anonymous-artifact

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify artifact integrity and anonymity
        run: python3 scripts/verify_artifact.py
      - name: Reproduce manuscript counts
        run: python3 scripts/reproduce_paper_numbers.py
